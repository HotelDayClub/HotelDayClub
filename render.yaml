services:
  - type: web
    name: hotel-day-club
    runtime: node
    # Leave this as free. A blueprint sync would otherwise change the live plan.
    # Upgrade to Starter in the Render dashboard before attaching a disk. See README.
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATA_DIR
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: COOKIE_SECRET
        sync: false
      - key: DEMO_HOTEL_PASSWORD
        sync: false
      - key: ABN
        sync: false
      - key: CONTACT_EMAIL
        sync: false
      - key: GA_MEASUREMENT_ID
        value: G-9F5ZH1T4YN
      - key: WAITLIST_WEBHOOK_URL
        sync: false
      - key: WAITLIST_WEBHOOK_TOKEN
        sync: false
      - key: SITE_INDEXABLE
        value: "true"
      - key: LEGAL_PAGES_INDEXABLE
        sync: false
      - key: GOOGLE_SITE_VERIFICATION
        sync: false
      - key: BING_SITE_VERIFICATION
        sync: false
