services:
  - type: web
    name: hotel-day-club
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: ADMIN_PASSWORD
        sync: false
      - key: DEMO_HOTEL_PASSWORD
        sync: false
      - key: ABN
        sync: false
      - key: CONTACT_EMAIL
        sync: false
      - key: GA_MEASUREMENT_ID
        value: G-9F5ZH1T4YN
      - key: WAITLIST_WEBHOOK_URL
        sync: false
      - key: WAITLIST_WEBHOOK_TOKEN
        sync: false
