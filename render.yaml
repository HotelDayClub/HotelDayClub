services:
  - type: web
    name: hotel-day-club
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: ADMIN_PASSWORD
        sync: false
      - key: DEMO_HOTEL_PASSWORD
        sync: false
      - key: SHOW_ABN
        sync: false
      - key: CONTACT_EMAIL
        sync: false
